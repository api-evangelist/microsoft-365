  name: Microsoft Graph API
  description: >-
    Unified REST API providing a single endpoint to access data and intelligence across Microsoft 365,
    Microsoft Entra ID, Windows, and Enterprise Mobility + Security. Supports OAuth 2.0 authentication
    and covers users, mail, calendar, contacts, files (OneDrive), Teams, SharePoint, OneNote, Planner,
    To Do, Excel, and security services.
