aid: microsoft-365
name: Microsoft 365
description: Microsoft 365 is Microsoft's productivity and collaboration suite, including
  Word, Excel, PowerPoint, Outlook, Teams, OneDrive, SharePoint, and OneNote, along
  with identity, security, and device management services. Developers access Microsoft
  365 data and intelligence programmatically through Microsoft Graph, a unified REST
  API that exposes users, mail, calendar, files, Teams messages, sites, devices, and
  more across the Microsoft cloud.
