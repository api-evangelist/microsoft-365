}

type Mutation {
  sendMessage(userId: ID!, message: MessageInput!): Message
  createEvent(userId: ID!, event: EventInput!): Event
  updateEvent(userId: ID!, eventId: ID!, event: EventInput!): Event
  deleteEvent(userId: ID!, eventId: ID!): Boolean
  createPlannerTask(task: PlannerTaskInput!): PlannerTask
  updatePlannerTask(id: ID!, task: PlannerTaskInput!): PlannerTask
  createToDoTask(listId: ID!, task: ToDoTaskInput!): ToDoTask
  updateToDoTask(listId: ID!, taskId: ID!, task: ToDoTaskInput!): ToDoTask
  createTeam(team: TeamInput!): Team
  createChannel(teamId: ID!, channel: ChannelInput!): Channel
  sendChannelMessage(teamId: ID!, channelId: ID!, message: ChatMessageInput!): ChannelMessage
  createOnlineMeeting(meeting: OnlineMeetingInput!): OnlineMeeting
  uploadDriveItem(driveId: ID!, parentId: ID!, name: String!, content: String!): DriveItem
}

